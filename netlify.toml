[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/downloads/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/free2bme/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

