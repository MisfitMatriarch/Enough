name: Website quality

on:
  pull_request:
  push:
    branches: [main, 'claude/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Site quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject known vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Unit tests
        run: npm test
      - name: Production build and internal-file guard
        run: npm run build
      - name: All-page links, assets and form contracts
        run: python3 scripts/check-site-contracts.py
      - name: Install browser test tooling without changing the lockfile
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 @axe-core/playwright@4.11.1
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Desktop and phone browser baseline
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/enough-site-server.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node review/handover/check-site.js site-check
          node scripts/check-release.cjs site-check/release
          node scripts/check-accessibility.cjs site-check/accessibility
      - name: Retain browser review captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-and-phone-checks
          path: site-check/
          if-no-files-found: ignore
          retention-days: 7
